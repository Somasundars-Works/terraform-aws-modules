name: Validate Terraform Modules & Apps
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  folders:
    name: Discover Terraform Modules & Apps
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.get-folders.outputs.folders }}
      apps: ${{ steps.get-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
    
      - name: Get Folders
        id: get-folders
        run: |
          folders_modules=$(find modules/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          folders_apps=$(find apps/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "modules=$folders_modules" >> "$GITHUB_OUTPUT"
          echo "apps=$folders_apps" >> "$GITHUB_OUTPUT"

  terraform-validate-modules:
    if: ${{ needs.folders.outputs.modules != '' }}
    needs: folders
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.folders.outputs.modules) }}
    name: Module - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check

  terraform-validate-apps:
    if: ${{ needs.folders.outputs.apps != '' }}
    needs: folders
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.folders.outputs.apps) }}
    name: App - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check