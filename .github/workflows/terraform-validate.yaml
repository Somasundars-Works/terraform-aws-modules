name: Validate Terraform Modules & Apps
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  folders:
    name: Discover Terraform Modules & Apps
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.get-folders.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
    
      - name: Get Folders
        id: get-folders
        run: |
          folders_modules=$(find modules/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort)

          folders_apps=$(find apps/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort)

          json=$(printf '%s\n' "$folders_modules" "$folders_apps" | jq -R . | jq -s -c .)
          echo "folders=$json" >> "$GITHUB_OUTPUT"

  terraform-validate:
    if: ${{ needs.folders.outputs.folders != '' }}
    needs: folders
    strategy:
      matrix:
        folder: ${{ fromJSON(needs.folders.outputs.folders) }}
    name: Terraform Validate - ${{ matrix.folder }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check