name: Validate Terraform Modules & Apps
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.6"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

  folders:
    name: Discover Terraform Modules & Apps
    runs-on: ubuntu-latest
    outputs:
      output_modules: ${{ steps.get-folders.outputs.output_modules }}
      output_apps: ${{ steps.get-folders.outputs.output_apps }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
    
      - name: Get Folders
        id: get-folders
        run: |
          folders_modules=$(find modules/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          json_modules=$(jq -cn \
            --argjson modules "$folders_modules" \
            '$modules')

          echo "output_modules=$json_modules" >> "$GITHUB_OUTPUT"

          folders_apps=$(find apps/ -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')

          json_apps=$(jq -cn \
            --argjson apps "$folders_apps" \
            '$apps')

          echo "output_apps=$json_apps" >> "$GITHUB_OUTPUT"

          echo "Modules found: $folders_modules"
          echo "Apps found: $folders_apps"
          echo "output_modules=$json_modules"
          echo "output_apps=$json_apps"
          echo "Folders discovery completed."


  terraform-validate-modules:
    if: ${{ needs.folders.outputs.output_modules != '' && needs.folders.outputs.output_modules != '[]' }}
    needs: folders
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.folders.outputs.output_modules) }}
    name: Module - ${{ matrix.modules }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Terraform Init and Validate
        uses: Somasundars-Works/devops-toolkit/actions/terraform-validate@v1.0.0
        with:
            working_directory: modules/${{ matrix.modules }}
            terraform_version: "1.14.6"

  terraform-validate-apps:
    if: ${{ needs.folders.outputs.output_apps != '' && needs.folders.outputs.output_apps != '[]' }}
    needs: folders
    strategy:
      matrix:
        apps: ${{ fromJSON(needs.folders.outputs.output_apps) }}
    name: App - ${{ matrix.apps }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Terraform Init and Validate
        uses: Somasundars-Works/devops-toolkit/actions/terraform-validate@v1.0.0
        with:
            working_directory: apps/${{ matrix.apps }}
            terraform_version: "1.14.6"

  validation-status:
    name: Terraform Validation Status
    if: always()
    needs: [terraform-format, folders, terraform-validate-modules, terraform-validate-apps]
    runs-on: ubuntu-latest
    steps:
      - name: Check formatting, module, and app validation results
        env:
          FORMAT_RESULT: ${{ needs.terraform-format.result }}
          FOLDERS_RESULT: ${{ needs.folders.result }}
          MODULES_RESULT: ${{ needs.terraform-validate-modules.result }}
          APPS_RESULT: ${{ needs.terraform-validate-apps.result }}
        run: |
          if [[ "$FORMAT_RESULT" != "success" || \
                "$FOLDERS_RESULT" != "success" || \
                ( "$MODULES_RESULT" != "success" && "$MODULES_RESULT" != "skipped" ) || \
                ( "$APPS_RESULT" != "success" && "$APPS_RESULT" != "skipped" ) ]]; then
            echo "Terraform checks failed: format=$FORMAT_RESULT, folders=$FOLDERS_RESULT, modules=$MODULES_RESULT, apps=$APPS_RESULT"
            exit 1
          fi
          echo "Terraform formatting and all module/app validations passed."

  